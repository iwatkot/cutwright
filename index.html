<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/branding/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/x-icon" href="/branding/cutwright.ico" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <title>CutWright</title>
    <style>html{background:#f3f5f8}html[data-theme=dark]{background:#191d23}@media(prefers-color-scheme:dark){html:not([data-theme=light]){background:#191d23}}</style>
    <script>var t;try{t=localStorage.getItem('cutwright.theme')}catch(e){}var d=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=d;document.documentElement.style.colorScheme=d</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
